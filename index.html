.form-select:not(:disabled):hover {

}

.form-select:focus-visible {

}

.form-check {

  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:

    border-color 150ms,
    box-shadow 150ms;

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);

.form-check:not(.form-switch)

}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)

  display: block;
  width: 100%;
  height: 100%;

}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {

  background:

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {

  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {

  height: 20px;

  box-shadow: none;

.form-switch .form-check-input::before {
  position: absolute;

  left: 0;

  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));

  box-shadow: var(--shadow-sm);

}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;

.form-range::-webkit-slider-runnable-track {

.form-range:focus-visible::-webkit-slider-thumb {

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {

  height: 20px;

  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);

.form-range:disabled {

.btn:not(.btn-primary, .viz-tile):is(

&lt;body&gt;
&lt;div id=&quot;rag-agent-harness&quot; lang=&quot;zh-CN&quot;&gt;
 &lt;h3&gt;RAG × Agent × Harness · 完整架构与运行路径&lt;/h3&gt;
 &lt;div class=&quot;viz-controls&quot;&gt;&lt;label class=&quot;form-label&quot; for=&quot;rh-route&quot;&gt;演示路径&lt;select id=&quot;rh-route&quot; class=&quot;form-select&quot;&gt;&lt;option value=&quot;rag&quot;&gt;独立 RAG&lt;/option&gt;&lt;option value=&quot;combined&quot; selected&gt;Agent ＋ RAG&lt;/option&gt;&lt;option value=&quot;tool&quot;&gt;Agent 工具闭环&lt;/option&gt;&lt;option value=&quot;sub&quot;&gt;Agent 委派闭环&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;&lt;div class=&quot;viz-row&quot;&gt;&lt;button class=&quot;btn&quot; id=&quot;rh-prev&quot; type=&quot;button&quot;&gt;上一步&lt;/button&gt;&lt;button class=&quot;btn btn-primary&quot; id=&quot;rh-play&quot; type=&quot;button&quot;&gt;播放路径&lt;/button&gt;&lt;button class=&quot;btn&quot; id=&quot;rh-next&quot; type=&quot;button&quot;&gt;下一步&lt;/button&gt;&lt;button class=&quot;btn btn-ghost&quot; id=&quot;rh-reset&quot; type=&quot;button&quot;&gt;看全局&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;
 &lt;div class=&quot;viz-row&quot;&gt;&lt;span id=&quot;rh-count&quot; class=&quot;text-small tabular-nums&quot;&gt;&lt;/span&gt;&lt;span id=&quot;rh-caption&quot; role=&quot;status&quot; aria-live=&quot;polite&quot;&gt;&lt;/span&gt;&lt;/div&gt;
 &lt;div id=&quot;rh-stage&quot;&gt;&lt;/div&gt;
 &lt;div class=&quot;viz-row text-small&quot;&gt;&lt;span&gt;● 高亮：当前传递&lt;/span&gt;&lt;span&gt;实线箭头：数据／控制流&lt;/span&gt;&lt;span&gt;虚线：索引／记忆支持&lt;/span&gt;&lt;span&gt;方框边界：职责范围&lt;/span&gt;&lt;/div&gt;
 &lt;h3&gt;Harness 内的编排模式 · 可组合，非必经步骤&lt;/h3&gt;
 &lt;div class=&quot;rh-patterns&quot;&gt;
 &lt;div&gt;&lt;span&gt;Routing 路由&lt;/span&gt;&lt;div class=&quot;text-small&quot;&gt;输入 → 选择 A / B 路径&lt;/div&gt;&lt;/div&gt;
 &lt;div&gt;&lt;span&gt;Prompt Chaining 调用链&lt;/span&gt;&lt;div class=&quot;text-small&quot;&gt;调用 A → 检查 → 调用 B&lt;/div&gt;&lt;/div&gt;
 &lt;div&gt;&lt;span&gt;Parallelization 并行&lt;/span&gt;&lt;div class=&quot;text-small&quot;&gt;分叉 → A ∥ B → 汇总&lt;/div&gt;&lt;/div&gt;
 &lt;div&gt;&lt;span&gt;Orchestrator–Workers&lt;/span&gt;&lt;div class=&quot;text-small&quot;&gt;动态拆分 → 委派 → 汇总&lt;/div&gt;&lt;/div&gt;
 &lt;div&gt;&lt;span&gt;Evaluator–Optimizer&lt;/span&gt;&lt;div class=&quot;text-small&quot;&gt;生成 ⇄ 评估反馈 → 修订&lt;/div&gt;&lt;/div&gt;
 &lt;div&gt;&lt;span&gt;执行对象&lt;/span&gt;&lt;div class=&quot;text-small&quot;&gt;模型调用 / 工具 / 子 Agent&lt;/div&gt;&lt;/div&gt;
 &lt;/div&gt;
 &lt;details&gt;&lt;summary&gt;概念边界与图中简化&lt;/summary&gt;&lt;dl&gt;
 &lt;dt&gt;Harness 与 Agent&lt;/dt&gt;&lt;dd&gt;本图讨论基于 LLM 的 Agent。Harness 是使模型能够持续执行任务的运行支撑系统，不是额外的模型或流水线节点。框中展示其负责协调的模型接口、上下文、状态、执行控制；模型推理能力来自模型本身。外部工具、存储和子 Agent 不必归属于 Harness。&lt;/dd&gt;
 &lt;dt&gt;RAG 的两种接法&lt;/dt&gt;&lt;dd&gt;左侧是完整的独立 RAG：检索 → 增强 → 生成。与 Agent 结合时，证据经观察与状态更新进入 Agent 的 Context，由右侧模型继续生成或行动，不必再调用左侧独立生成器。不同路径共用底图，不代表所有节点都要执行。&lt;/dd&gt;
 &lt;dt&gt;检索编码&lt;/dt&gt;&lt;dd&gt;向量路径将 Query 编码后，与兼容表示空间中的文档向量匹配；编码器不一定是同一个。BM25 走关键词索引，不需稠密 Query Embedding。可只用一条路径，也可混合检索。Metadata 可用于过滤；重排可选。&lt;/dd&gt;
 &lt;dt&gt;State、Memory、Context&lt;/dt&gt;&lt;dd&gt;State 包含当前任务状态；短期记忆通常是其中的会话信息，可以持久化。Context 是本轮实际选入模型输入的信息。长期记忆跨会话保存，图中用读取路径表示；可按需写回。记忆不等于模型权重更新。&lt;/dd&gt;
 &lt;dt&gt;CoT 与 ReAct&lt;/dt&gt;&lt;dd&gt;CoT 是中间步骤推理方法，不等于多次模型调用的 Prompt Chaining。ReAct 是将推理、行动、观察交织的思路，是 Agent loop 的一种实现；不是每个 Agent 都必须使用。动画表示可观察的调用与信息流，不展示模型内部推理原文。&lt;/dd&gt;
 &lt;dt&gt;Orchestration 与 Router&lt;/dt&gt;&lt;dd&gt;Orchestration 是协调调用、状态、依赖与停止的职责。Router 负责选择路径，可由规则或模型实现，不必独立成服务。下方五种编排模式不属于 Subagent 的子类，也不是固定先后顺序。&lt;/dd&gt;
 &lt;dt&gt;Evaluator–Optimizer 与 Subagent&lt;/dt&gt;&lt;dd&gt;评估—修订可以用于局部输出或最终候选结果，不是参数训练，也不等于所有环境反馈循环。Subagent 是接受委派的执行角色，可以共享基础模型，并有自己的上下文、工具和循环；普通工作者不必是完整 Agent。&lt;/dd&gt;
 &lt;dt&gt;停止与安全边界&lt;/dt&gt;&lt;dd&gt;模型可以选择完成，Harness 也可按步数、预算、超时或权限规则停止、重试或请求人工介入。图为教学用职责划分，工程实现没有唯一统一的分层标准。&lt;/dd&gt;
 &lt;/dl&gt;&lt;/details&gt;

 &lt;li&gt;&lt;a href=&quot;https://aws.amazon.com/what-is/retrieval-augmented-generation/&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;AWS：What is RAG?&lt;/a&gt;&lt;/li&gt;
 &lt;li&gt;&lt;a href=&quot;https://arxiv.org/abs/2005.11401&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;Lewis 等：RAG 原始论文&lt;/a&gt;&lt;/li&gt;
 &lt;li&gt;&lt;a href=&quot;https://learn.microsoft.com/en-us/azure/search/retrieval-augmented-generation-overview&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;Microsoft：RAG 与检索架构&lt;/a&gt;&lt;/li&gt;
 &lt;li&gt;&lt;a href=&quot;https://www.anthropic.com/engineering/contextual-retrieval&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;Anthropic：Contextual Retrieval&lt;/a&gt;&lt;/li&gt;
 &lt;/ul&gt;&lt;/details&gt;
 &lt;details&gt;&lt;summary&gt;一手参考资料 · Agent 与 Harness&lt;/summary&gt;&lt;ul&gt;
 &lt;li&gt;&lt;a href=&quot;https://www.anthropic.com/engineering/building-effective-agents&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;Anthropic：Building Effective Agents（工作流与编排模式）&lt;/a&gt;&lt;/li&gt;
 &lt;li&gt;&lt;a href=&quot;https://www.anthropic.com/engineering/demystifying-evals-for-ai-agents&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;Anthropic：Demystifying Evals（Agent Harness 定义）&lt;/a&gt;&lt;/li&gt;
 &lt;li&gt;&lt;a href=&quot;https://www.anthropic.com/engineering/managed-agents&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;Anthropic：Managed Agents（Harness、Session 与 Sandbox 的边界）&lt;/a&gt;&lt;/li&gt;
 &lt;li&gt;&lt;a href=&quot;https://www.anthropic.com/engineering/effective-harnesses-for-long-running-agents&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;Anthropic：Effective Harnesses for Long-running Agents&lt;/a&gt;&lt;/li&gt;
 &lt;li&gt;&lt;a href=&quot;https://arxiv.org/abs/2210.03629&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;Yao 等：ReAct&lt;/a&gt;；&lt;a href=&quot;https://arxiv.org/abs/2201.11903&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;Wei 等：Chain-of-Thought&lt;/a&gt;&lt;/li&gt;
 &lt;li&gt;&lt;a href=&quot;https://docs.langchain.com/oss/python/concepts/memory&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;LangChain：Memory&lt;/a&gt;；&lt;a href=&quot;https://docs.langchain.com/oss/python/langchain/multi-agent/subagents&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;Subagents&lt;/a&gt;&lt;/li&gt;
 &lt;li&gt;&lt;a href=&quot;https://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;Anthropic：Context Engineering&lt;/a&gt;&lt;/li&gt;
 &lt;/ul&gt;&lt;/details&gt;
